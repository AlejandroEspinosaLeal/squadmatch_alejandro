<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SquadMatch · Jugadores Compatibles</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="contenedor-app">
        <aside class="menu-lateral">
            <div>
                <div class="logo">
                    <span class="logo-icono">L</span>
                    <span class="logo-texto">SquadMatch</span>
                </div>

                <nav class="navegacion">
                    <a href="index.html" class="enlace activo">Jugadores Compatibles</a>
                    <a href="usuarios.html" class="enlace">Usuarios</a>
                    <a href="crear.html" class="enlace">Contacto</a>
                </nav>
            </div>
            
            <div class="perfil">
                <div class="avatar">AV</div>
                <div>
                    <p class="perfil-nombre">Jugador_1</p>
                    <p class="perfil-karma">★ 4.9 (42)</p>
                </div>
            </div>
        </aside>

        <main class="contenido">
            <header class="cabecera">
                <h1>Jugadores Compatibles</h1>
                <a href="crear.html" class="enlace-cabecera">+ CONTACTO / SOPORTE</a>
            </header>

            <div class="columnas">
                <section>
                    <h2>Listado de Jugadores</h2>
                    <div id="listado-jugadores" class="listado"></div>
                </section>

                <section>
                    <h2>Ficha Completa del Jugador</h2>
                    <div id="detalle-jugador" class="detalle">
                        <p class="aviso">Pulsa sobre un jugador del listado para ver su ficha completa.</p>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script type="module" src="js/main.js"></script>

</html>
